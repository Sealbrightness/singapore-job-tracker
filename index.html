<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Singapore Job Tracker</title><style>:root{--b:#f5f7fb;--c:#fff;--t:#172033;--m:#667085;--l:#e4e7ec;--a:#175cd3;--g:#067647}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial;background:var(--b);color:var(--t)}header{background:#101828;color:#fff;padding:26px 30px}header h1{margin:0 0 5px}header p{margin:0;color:#d0d5dd}.w{max-width:1600px;margin:auto;padding:20px 30px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.panel{background:var(--c);border:1px solid var(--l);border-radius:12px}.card{padding:15px}.card b{font-size:24px;display:block}.card span{font-size:11px;color:var(--m)}.controls{margin:14px 0;padding:12px;display:grid;grid-template-columns:2fr repeat(3,1fr);gap:8px}input,select{padding:10px;border:1px solid #d0d5dd;border-radius:8px;background:white}.tbl{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}th{background:#f9fafb;white-space:nowrap;cursor:pointer}.fit{font-weight:800;color:var(--g)}.lane{background:#eef4ff;color:#3538cd;border-radius:999px;padding:3px 7px;font-size:11px;white-space:nowrap}.apply{background:var(--a);color:white;text-decoration:none;padding:6px 9px;border-radius:7px;white-space:nowrap}.fresh{color:var(--g);font-weight:700}@media(max-width:800px){.w{padding:14px}.stats{grid-template-columns:1fr 1fr}.controls{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>Singapore Job Tracker</h1><p>Finance, investment, risk & audit opportunities — sortable and filterable</p></header><main class='w'><section class='stats'><div class='card'><b id='n'>0</b><span>VISIBLE JOBS</span></div><div class='card'><b id='today'>0</b><span>NEW TODAY</span></div><div class='card'><b id='hi'>0</b><span>FIT ≥ 9</span></div><div class='card'><b id='ln'>0</b><span>SEARCH LANES</span></div></section><section class='panel controls'><input id='q' placeholder='Search title or company'><select id='lane'><option value=''>All lanes</option></select><select id='fresh'><option value=''>Any freshness</option><option>New today</option><option>Recent 2–7d</option><option>Older active</option></select><select id='fit'><option value='0'>Any fit</option><option value='9'>Fit ≥ 9</option><option value='8'>Fit ≥ 8</option><option value='7'>Fit ≥ 7</option></select></section><section class='panel tbl'><table><thead><tr><th data-s='date'>Posted ↕</th><th data-s='fit'>Fit ↕</th><th>Job</th><th>Company</th><th>Lane</th><th>Experience</th><th>Salary</th><th>Why it fits</th><th>Link</th></tr></thead><tbody id='body'></tbody></table></section></main><script>let jobs=[],sk='date',sd=-1;const $=x=>document.getElementById(x);async function load(){jobs=await(await fetch('jobs.json?'+Date.now())).json();[...new Set(jobs.map(j=>j.lane))].sort().forEach(v=>$('lane').insertAdjacentHTML('beforeend',`<option>${v}</option>`));['q','lane','fresh','fit'].forEach(x=>$(x).addEventListener(x==='q'?'input':'change',render));document.querySelectorAll('[data-s]').forEach(h=>h.onclick=()=>{if(sk===h.dataset.s)sd*=-1;else{sk=h.dataset.s;sd=-1}render()});render()}function render(){let q=$('q').value.toLowerCase(),l=$('lane').value,f=$('fresh').value,m=+$('fit').value,a=jobs.filter(j=>(!q||(j.title+' '+j.company).toLowerCase().includes(q))&&(!l||j.lane===l)&&(!f||j.freshness===f)&&j.fit>=m);a.sort((x,y)=>((sk==='fit'?x.fit:new Date(x.date))>(sk==='fit'?y.fit:new Date(y.date))?1:-1)*sd);$('n').textContent=a.length;$('today').textContent=a.filter(j=>j.freshness==='New today').length;$('hi').textContent=a.filter(j=>j.fit>=9).length;$('ln').textContent=new Set(a.map(j=>j.lane)).size;$('body').innerHTML=a.map(j=>`<tr><td class='${j.freshness==='New today'?'fresh':''}'>${j.dateLabel}</td><td class='fit'>${j.fit.toFixed(1)}</td><td><b>${j.title}</b></td><td>${j.company}</td><td><span class='lane'>${j.lane}</span></td><td>${j.experience||'Not disclosed'}</td><td>${j.salary||'Not disclosed'}</td><td>${j.why}</td><td><a class='apply' target='_blank' rel='noopener' href='${j.url}'>Apply ↗</a></td></tr>`).join('')||`<tr><td colspan='9' style='text-align:center;padding:30px;color:#667085'>No jobs match these filters.</td></tr>`}load()</script></body></html>
